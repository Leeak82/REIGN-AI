name: REIGN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore REIGN.slnx

      - name: Build Release
        run: dotnet build REIGN.slnx -c Release --no-restore --nologo

      - name: Test Release
        run: dotnet test REIGN.slnx -c Release --no-build --nologo --logger "trx;LogFileName=reign-ci.trx" --results-directory ./TestResults

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reign-test-results
          path: TestResults/
          if-no-files-found: ignore
