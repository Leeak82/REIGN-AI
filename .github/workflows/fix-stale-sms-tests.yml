name: One-time stale SMS test repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-stale-sms-tests.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align tests with current SkipCalls contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('REIGN.Tests/ConfigAndCalendarTests.cs')
          text = path.read_text()

          old_name = 'public void Runtime_defaults_route_straight_talk_to_smsgate_while_a2p_is_pending()'
          new_name = 'public void Runtime_defaults_route_voice_fallback_to_smsgate_when_twilio_is_not_configured()'
          if old_name not in text:
              raise SystemExit('stale runtime-default test name not found')
          text = text.replace(old_name, new_name, 1)

          start = text.index(new_name)
          business = '["Sms:BusinessPhoneNumber"] = ReignContact.BusinessPhoneE164,'
          pos = text.index(business, start)
          text = text[:pos] + text[pos:].replace(
              business,
              '["Sms:BusinessPhoneNumber"] = ReignContact.VoicePhoneE164,',
              1)

          old_settings_name = 'public void Production_appsettings_targets_google_calendar_id()'
          new_settings_name = 'public void Production_appsettings_targets_current_sms_and_google_calendar()'
          if old_settings_name not in text:
              raise SystemExit('stale production-appsettings test name not found')
          text = text.replace(old_settings_name, new_settings_name, 1)

          stale = 'Assert.Contains("\\\"Provider\\\": \\\"SmsGate\\\"", json, StringComparison.Ordinal);'
          current = 'Assert.Contains("\\\"Provider\\\": \\\"SkipCalls\\\"", json, StringComparison.Ordinal);'
          if stale not in text:
              raise SystemExit('stale SmsGate assertion not found')
          text = text.replace(stale, current, 1)

          path.write_text(text)
          Path('.github/workflows/fix-stale-sms-tests.yml').unlink()
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'Leeak82'
          git config user.email '166353240+Leeak82@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: align SMS assertions with SkipCalls deployment'
          git push origin HEAD:main
