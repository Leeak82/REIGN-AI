# Local Docker development for REIGN.API.
# Put OAuth/API credentials in a gitignored .env or the host environment.
# Never put Client ID, Client Secret, or other secrets in this file.

services:
  reign-api:
    container_name: reign-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    # Literal 8080 callback. Loaded before `environment` so compose `environment`
    # pins still win, and host `.env` :5001 values cannot become container env
    # unless explicitly interpolated (those keys are not interpolated below).
    env_file:
      - docker-oauth.env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Local compose only. Forces the 8080 Google callback even if appsettings still has :5001.
      REIGN_DOCKER: "1"
      ConnectionStrings__Reign: Data Source=/data/REIGN.db
      # Pass-through only. Blank/unset host values stay blank and are not secrets.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Pin Docker's published callback. Do NOT interpolate host GOOGLE_REDIRECT_URI
      # or GoogleCalendar__RedirectUri. A gitignored .env for `dotnet run` often
      # contains https://localhost:5001/... which would otherwise become the
      # container value and look like appsettings.json winning.
      GOOGLE_REDIRECT_URI: "http://localhost:8080/api/integrations/google/callback"
      GoogleCalendar__RedirectUri: "http://localhost:8080/api/integrations/google/callback"
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      GOOGLE_CALENDAR_TIMEZONE: ${GOOGLE_CALENDAR_TIMEZONE:-America/Los_Angeles}
      GoogleCalendar__CalendarId: ${GOOGLE_CALENDAR_ID:-primary}
      GoogleCalendar__TimeZone: ${GOOGLE_CALENDAR_TIMEZONE:-America/Los_Angeles}
      GoogleCalendar__Provider: ${GoogleCalendar__Provider:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      Ai__ApiKey: ${Ai__ApiKey:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      Sms__Provider: ${Sms__Provider:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      TWILIO_WEBHOOK_URL: ${TWILIO_WEBHOOK_URL:-}
      VONAGE_API_KEY: ${VONAGE_API_KEY:-}
      VONAGE_API_SECRET: ${VONAGE_API_SECRET:-}
      VONAGE_SIGNATURE_SECRET: ${VONAGE_SIGNATURE_SECRET:-}
      VONAGE_FROM_NUMBER: ${VONAGE_FROM_NUMBER:-}
      SMSGATE_USERNAME: ${SMSGATE_USERNAME:-}
      SMSGATE_PASSWORD: ${SMSGATE_PASSWORD:-}
      SMSGATE_SIGNING_KEY: ${SMSGATE_SIGNING_KEY:-}
      SMSGATE_FROM_NUMBER: ${SMSGATE_FROM_NUMBER:-}
      REIGN_INTERNAL_API_KEY: ${REIGN_INTERNAL_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - reign_data:/data
    # Dockerfile ENTRYPOINT is "dotnet REIGN.API.dll". This wrapper only chooses
    # the calendar provider from whether Google credentials were passed through.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export REIGN_DOCKER=1
        export GOOGLE_REDIRECT_URI=http://localhost:8080/api/integrations/google/callback
        export GoogleCalendar__RedirectUri=http://localhost:8080/api/integrations/google/callback
        if [ -n "$$GOOGLE_CLIENT_ID" ] && [ -n "$$GOOGLE_CLIENT_SECRET" ]; then
          if [ -z "$$GoogleCalendar__Provider" ]; then
            export GoogleCalendar__Provider=Google
          fi
        else
          export GoogleCalendar__Provider=Simulated
        fi
        exec dotnet REIGN.API.dll
    # mcr.microsoft.com/dotnet/aspnet:10.0 (see Dockerfile) does not include curl
    # or wget, and the image is not modified. Port 8080 is 0x1F90; 0A is LISTEN.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -q ':1F90 00000000:0000 0A ' /proc/net/tcp || grep -q ':1F90 00000000000000000000000000000000:0000 0A ' /proc/net/tcp6"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  reign-web:
    container_name: reign-web
    build:
      context: .
      dockerfile: REIGN.Web/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: "8080"
      REIGN_API_BASE_URL: http://reign-api:8080/
      ReignApi__BaseUrl: http://reign-api:8080/
    depends_on:
      reign-api:
        condition: service_healthy

volumes:
  reign_data:
